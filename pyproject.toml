[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "another-ssg"
version = "0.1.0"
description = "A minimalistic static site generator with support for LaTeX and Mermaid"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Murilo"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

dependencies = [
    "markdown==3.10.2",
    "pygments==2.20.0",
]

[project.scripts]
another-ssg = "main:main"

[tool.setuptools]
py-modules = ["main"]